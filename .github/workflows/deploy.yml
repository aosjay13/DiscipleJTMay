name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Refresh chapter counts
        run: node scripts/update-chapter-counts.mjs

      - name: Commit refreshed counts
        run: |
          if git diff --quiet -- "Through the Word.html"; then
            echo "Chapter counts already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Through the Word.html"
          git commit -m "Refresh chapter counts [skip ci]"
          git push origin HEAD:main

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
